# Gemini 개발 시험(v0.4.77, 소유자 2026-11-02 "Gemini로 개발 되는지 시험"): 쉬운 개발 한 건을 Gemini CLI(무료 키)로 맡긴다.
# 지금은 손으로만 실행한다: Actions → "Gemini 개발(시험)" → Run workflow. 앱과는 아직 연결하지 않았다(결과가 괜찮으면 붙인다).
# 하는 일: 대상 저장소(AI Office가 관리하는 minho-nim/… 저장소)의 main에서 ai/gemini/… 브랜치를 만들고,
#   Gemini CLI가 지시대로 고친 뒤 시험을 돌리고, 그 브랜치만 push한다. PR·병합·배포는 하지 않는다.
# 필요한 저장소 secrets(소유자가 Settings → Secrets and variables → Actions에서 넣음):
#   GEMINI_API_KEY      Gemini 무료 키 A(AI Studio, 앱의 Studio A). 유료 결제가 연결되지 않은 키만.
#   GEMINI_API_KEY2     Gemini 무료 키 B(앱의 Studio B). 둘 중 하나만 있어도 돈다(v0.4.81: A가 한도·오류로 실패하면 B로 한 번 더).
#   TARGET_REPO_TOKEN   대상 저장소에만 Contents 읽기·쓰기 권한을 준 fine-grained 토큰.
# 안전: 토큰은 Gemini가 도는 단계에 넘기지 않는다(받기·올리기 단계에만). 이 저장소와 minho-nim/MinLab은 대상으로 받지 않는다.
name: Gemini 개발

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '대상 저장소(예: minho-nim/TestRepo)'
        required: true
      branch:
        description: '만들 작업 브랜치(ai/gemini/로 시작)'
        required: true
        default: 'ai/gemini/try-1'
      instructions:
        description: '할 일(쉬운 수정 한 건)'
        required: true
      key:
        description: '먼저 쓸 Gemini 키(auto = A 먼저, 실패하면 B)'
        required: false
        type: choice
        options: [auto, A, B]
        default: auto
      model:
        description: 'Gemini 모델(무료 키에서 되는 것)'
        required: false
        default: 'gemini-3.5-flash-lite'
      task_id:
        description: '(앱이 채움) AI Office 업무 ID — 있으면 끝난 뒤 결과를 앱으로 보낸다'
        required: false
        default: ''
      submit_token:
        description: '(앱이 채움) 결과 제출용 1회용 표 — 손으로 실행할 때는 비워 둔다'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gemini-dev-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: ${{ inputs.repo }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: 입력 확인
        env:
          SUBMIT_TOKEN: ${{ inputs.submit_token }}
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_KEY2: ${{ secrets.GEMINI_API_KEY2 != '' }}
          HAS_TOKEN: ${{ secrets.TARGET_REPO_TOKEN != '' }}
        run: |
          # 제출표는 로그에 남기지 않는다(v0.4.82)
          if [ -n "$SUBMIT_TOKEN" ]; then echo "::add-mask::$SUBMIT_TOKEN"; fi
          if ! [[ "$REPO" =~ ^minho-nim/[A-Za-z0-9._-]+$ ]]; then echo "::error::minho-nim/… 저장소만 받습니다."; exit 1; fi
          lower=$(echo "$REPO" | tr 'A-Z' 'a-z')
          if [ "$lower" = "minho-nim/minlab" ] || [ "$lower" = "minho-nim/minlab-ai-office" ]; then echo "::error::이 저장소는 대상으로 받지 않습니다."; exit 1; fi
          if ! [[ "$BRANCH" =~ ^ai/gemini/[a-z0-9._/-]+$ ]]; then echo "::error::브랜치는 ai/gemini/로 시작해야 합니다(소문자·숫자·-·_·.)."; exit 1; fi
          missing=""
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_KEY2" != "true" ]; then missing="$missing GEMINI_API_KEY(또는 GEMINI_API_KEY2)"; fi
          [ "$HAS_KEY" = "true" ] || echo "::notice::GEMINI_API_KEY(키 A)가 없어 키 B만 씁니다."
          [ "$HAS_KEY2" = "true" ] || echo "::notice::GEMINI_API_KEY2(키 B)가 없어 키 A만 씁니다."
          [ "$HAS_TOKEN" = "true" ] || missing="$missing TARGET_REPO_TOKEN"
          if [ -n "$missing" ]; then echo "::error::이 저장소(MinLab-AI-Office)의 Actions secrets에 없는 것:${missing} (Settings → Secrets and variables → Actions)"; exit 1; fi

      - name: 대상 저장소 받기(토큰은 남기지 않음)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 저장소 지도 스크립트 받기(이 저장소의 scripts/repo-map.mjs만)
        uses: actions/checkout@v4
        with:
          path: office
          sparse-checkout: scripts/repo-map.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 코드 그래프(Graphify, 토큰 아끼기)
        # v0.4.97: 함수 호출부를 grep 대신 그래프로 찾게 한다. 코드만 읽고(AI 호출 없음) 밖으로 보내지 않는다. 실패해도 개발은 계속.
        continue-on-error: true
        working-directory: work
        env:
          GRAPHIFY_BACKEND: none
          GRAPHIFY_QUERY_LOG_DISABLE: '1'
        run: |
          pipx install graphifyy==0.9.100 >/dev/null 2>&1 || pip install --user -q graphifyy==0.9.100
          echo "graphify-out/" >> .git/info/exclude
          timeout 180 graphify extract . --code-only --no-viz 2>&1 | tail -2

      - name: 작업 브랜치 만들기
        working-directory: work
        run: |
          git config user.name "MinLab AI Office (Gemini)"
          git config user.email "gemini-dev@users.noreply.github.com"
          git rev-parse HEAD > /tmp/base.sha
          git checkout -b "$BRANCH"

      - name: Gemini CLI로 고치기
        working-directory: work
        env:
          KEY_A: ${{ secrets.GEMINI_API_KEY }}
          KEY_B: ${{ secrets.GEMINI_API_KEY2 }}
          FIRST: ${{ inputs.key }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GRAPHIFY_BACKEND: none
          GRAPHIFY_QUERY_LOG_DISABLE: '1'
          INSTRUCTIONS: ${{ inputs.instructions }}
          MODEL: ${{ inputs.model }}
        run: |
          mkdir -p ~/.gemini
          echo '{"privacy":{"usageStatisticsEnabled":false}}' > ~/.gemini/settings.json
          {
            echo "너는 MinLab AI Office의 개발 담당이다. 지금 폴더(저장소)에서 아래 할 일 하나만 한다."
            echo "- 저장소 루트에 CLAUDE.md가 있으면 먼저 읽고 그 규칙을 따른다."
            echo "- 할 일 범위 밖 파일은 바꾸지 않는다. 비밀값·토큰·.env 내용을 출력하거나 파일에 쓰지 않는다."
            echo "- git commit·push·PR·배포는 하지 않는다(다음 단계가 한다). 다른 AI CLI를 설치하지 않는다."
            echo "- package.json이 있으면 고친 뒤 있는 시험(typecheck·test·build)을 돌려 통과시킨다."
            echo "- 할 일이 불분명하면 코드를 바꾸지 말고 이유만 적고 끝낸다."
            echo "- 화면 문구는 한국어로 쓴다. 끝나면 무엇을 바꿨는지 한국어로 3줄 이내로 요약한다."
            if [ -f graphify-out/graph.json ]; then
              echo "- 함수·컴포넌트를 누가 쓰는지는 grep 대신 \`graphify explain <이름>\`으로 먼저 찾는다(코드 그래프가 준비돼 있음, 안 되면 grep)."
            fi
            echo ""
            # 저장소 지도(v0.4.96, 토큰 아끼기): 이미 있는 함수·컴포넌트 목록. 모델 호출 없이 만든다.
            node ../office/scripts/repo-map.mjs 2>/dev/null || true
            echo ""
            echo "## 할 일"
            printf '%s\n' "$INSTRUCTIONS"
          } > /tmp/task.md
          # 키 순서: auto·A면 A→B, B면 B→A. 한도(429)·오류로 실패하면 고친 것을 되돌리고 다른 키로 한 번 더(v0.4.81).
          if [ "$FIRST" = "B" ]; then order="B A"; else order="A B"; fi
          used=""
          for slot in $order; do
            if [ "$slot" = "A" ]; then key="$KEY_A"; else key="$KEY_B"; fi
            [ -n "$key" ] || continue
            echo "### Gemini 키 ${slot}로 시작" | tee -a /tmp/gemini.log
            set +e
            GEMINI_API_KEY="$key" npx -y @google/gemini-cli@0.64.0 -m "$MODEL" --approval-mode yolo -p "$(cat /tmp/task.md)" > /tmp/gemini-run.log 2>&1
            code=$?
            set -e
            cat /tmp/gemini-run.log | tee -a /tmp/gemini.log
            if [ "$code" -eq 0 ] && ! grep -qiE 'RESOURCE_EXHAUSTED|quota|status 429|"code": ?429' /tmp/gemini-run.log; then used="$slot"; break; fi
            echo "::warning::키 ${slot} 실패(종료 코드 ${code}). 고친 것을 되돌리고 다른 키로 해 봅니다."
            git reset -q --hard && git clean -qfd
          done
          rm -f /tmp/task.md /tmp/gemini-run.log
          if [ -z "$used" ]; then echo "::error::두 키 모두 실패했습니다(한도·키 오류). 위 로그를 확인하세요."; exit 1; fi
          echo "GEMINI_KEY_USED=$used" >> "$GITHUB_ENV"
          echo "Gemini 키 ${used}로 끝냈습니다." | tee -a /tmp/gemini.log

      - name: 시험
        working-directory: work
        run: |
          : > /tmp/test.log
          if [ -f package.json ]; then
            (npm ci || npm install) >/tmp/install.log 2>&1 || { tail -40 /tmp/install.log; echo "::error::의존성 설치 실패"; exit 1; }
            for s in typecheck test build; do
              if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then
                echo "## npm run $s" | tee -a /tmp/test.log
                npm run "$s" 2>&1 | tail -60 | tee -a /tmp/test.log
                test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::npm run $s 실패"; exit 1; }
              fi
            done
          else
            echo "package.json 없음: 시험 건너뜀" | tee /tmp/test.log
          fi

      - name: 화면 확인(데스크톱·휴대폰 스크린샷)
        # v0.4.97(The Agency 증거 수집): 빌드 결과(dist·build·out의 index.html)가 있으면 데스크톱 1400px·휴대폰 400px으로 찍고
        # 콘솔 오류·가로 넘침을 시험 로그에 적는다. 사진은 결과와 함께 AI Office로 보내 업무 카드에서 바로 본다. 실패해도 계속.
        continue-on-error: true
        working-directory: work
        run: |
          site=""
          for d in dist build out; do [ -f "$d/index.html" ] && site="$d" && break; done
          [ -n "$site" ] || { echo "빌드된 화면(index.html)이 없어 화면 확인을 건너뜁니다."; exit 0; }
          (cd "$site" && python3 -m http.server 4173 >/dev/null 2>&1 &)
          mkdir -p /tmp/shot && cd /tmp/shot
          npm init -y >/dev/null 2>&1 && npm i -s --no-audit --no-fund playwright@1.49.1 >/dev/null 2>&1
          npx -y playwright@1.49.1 install --with-deps chromium >/dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const lines = ['## 화면 확인(자동)'];
            for (const [name, w, h] of [['데스크톱-1400', 1400, 900], ['휴대폰-400', 400, 860]]) {
              const p = await b.newPage({ viewport: { width: w, height: h } }); const errs = [];
              p.on('pageerror', (e) => errs.push(String(e))); p.on('console', (m) => m.type() === 'error' && errs.push(m.text()));
              await p.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 20000 }).catch((e) => errs.push('열기 실패: ' + e.message));
              await p.waitForTimeout(800);
              const over = await p.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1).catch(() => false);
              await p.screenshot({ path: `/tmp/shot/화면-${name}.jpg`, type: 'jpeg', quality: 70 });
              lines.push(`- ${name}: 콘솔 오류 ${errs.length}개${errs.length ? ' (' + errs.slice(0, 3).join(' / ').slice(0, 300) + ')' : ''}, 가로 넘침 ${over ? '있음' : '없음'}`);
              await p.close();
            }
            await b.close(); console.log(lines.join('\n'));
          })();
          JS
          node shot.js | tee -a /tmp/test.log

      - name: 비밀값 검사·커밋
        id: commit
        working-directory: work
        run: |
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "바뀐 것이 없습니다."; exit 0; fi
          if git diff --cached -U0 | grep -E '^\+' | grep -qE 'sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{30,}'; then
            echo "::error::비밀값처럼 보이는 줄이 추가돼 올리지 않습니다."; exit 1
          fi
          git commit -q -m "Gemini 개발: $(printf '%s' "$INSTRUCTIONS_HEAD" | head -n1 | sed 's/^#* *//' | head -c 60)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          INSTRUCTIONS_HEAD: ${{ inputs.instructions }}

      - name: 작업 브랜치만 올리기
        if: steps.commit.outputs.changed == 'true'
        working-directory: work
        env:
          TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          git push --force-with-lease "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: 요약
        if: always()
        run: |
          cd work 2>/dev/null || { echo "입력 확인에서 멈춰 요약할 것이 없습니다." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Gemini 개발(시험) — ${REPO} · ${BRANCH} · 키 ${GEMINI_KEY_USED:-없음}"
            echo ""
            echo "### Gemini 요약(마지막 30줄)"
            echo '```'
            tail -30 /tmp/gemini.log 2>/dev/null || echo '(로그 없음)'
            echo '```'
            echo "### 바뀐 파일"
            echo '```'
            git diff --stat origin/HEAD...HEAD 2>/dev/null || git show --stat --oneline HEAD 2>/dev/null | head -40
            echo '```'
            echo "### 시험(마지막 40줄)"
            echo '```'
            tail -40 /tmp/test.log 2>/dev/null || echo '(시험 없음)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 앱에서 시작했으면(제출표가 있으면) 성공·실패와 상관없이 결과를 AI Office로 보낸다(v0.4.82). 결과 패키지·자동 채점으로 이어진다.
      - name: 결과 보내기(AI Office)
        if: always() && inputs.submit_token != ''
        env:
          TASK_ID: ${{ inputs.task_id }}
          SUBMIT_TOKEN: ${{ inputs.submit_token }}
          JOB_STATUS: ${{ job.status }}
          SUBMIT_URL: https://kmmicksimbredbyvdmvx.supabase.co/functions/v1/submit-result
        run: |
          cd work 2>/dev/null || { echo "입력 확인에서 멈춰 보낼 결과가 없습니다."; exit 0; }
          base=$(cat /tmp/base.sha 2>/dev/null || git rev-parse HEAD)
          git add -A >/dev/null 2>&1 || true
          git diff --cached "$base" > /tmp/result.diff || true
          git diff --cached --name-only "$base" > /tmp/result.files || true
          python3 - <<'PY'
          import json, os
          def read(p, n=None):
              try:
                  t = open(p, encoding='utf-8', errors='replace').read()
              except OSError:
                  return ''
              return t[-n:] if n else t
          def shots():
              import base64, glob
              out = []
              for f in sorted(glob.glob('/tmp/shot/화면-*.jpg'))[:2]:
                  b = open(f, 'rb').read()
                  if 0 < len(b) <= 1_500_000:
                      out.append({'name': os.path.basename(f), 'mime': 'image/jpeg', 'data': base64.b64encode(b).decode()})
              return out
          log = read('/tmp/gemini.log')
          tail = log.split('### Gemini 키')[-1].splitlines()[1:] if '### Gemini 키' in log else log.splitlines()
          summary = '\n'.join([l for l in tail if l.strip() and not l.startswith(('[STARTUP]', 'YOLO mode', 'Warning:', 'Ripgrep'))][-15:]).strip()
          ok = os.environ.get('JOB_STATUS') == 'success'
          pushed = os.environ.get('PUSHED') == '1'
          result = {
              'summary': (summary or 'Gemini가 요약을 남기지 않았습니다.')[:3900],
              'changed_files': [f for f in read('/tmp/result.files').splitlines() if f],
              'diff': read('/tmp/result.diff')[:490000],
              'test_log': read('/tmp/test.log', 90000) or '(시험 로그 없음)',
              'remaining_issues': '' if ok else 'Gemini 개발 워크플로가 끝까지 성공하지 못했습니다(시험 실패·키 한도·비밀값 검사 등). 작업 브랜치는 올리지 않았습니다.',
              'branch': os.environ['BRANCH'] if pushed else '',
              'preview_pushed': False,
              'project_rules': [],
              'screenshots': shots(),
          }
          json.dump({'task_id': os.environ['TASK_ID'], 'token': os.environ['SUBMIT_TOKEN'], 'result': result}, open('/tmp/result-submit.json', 'w'), ensure_ascii=False)
          PY
          code=$(curl -sS -o /tmp/submit.out -w '%{http_code}' -X POST "$SUBMIT_URL" -H 'content-type: application/json' --data-binary @/tmp/result-submit.json || echo 000)
          rm -f /tmp/result-submit.json
          echo "AI Office 결과 보내기: HTTP ${code} $(head -c 200 /tmp/submit.out 2>/dev/null)"
          [ "$code" = "200" ] || echo "::warning::결과를 AI Office로 보내지 못했습니다(HTTP ${code})."
