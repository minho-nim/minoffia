# 모든 프로젝트 스킬 최신으로(2026-11-16 소유자 "매번 한 번씩 돌아야 돼?"): 한 번 실행으로 여러 프로젝트 저장소를 돌며,
# 그 저장소에 이미 들어 있는 스킬(.claude/skills·.agents/skills) 중 스킬 원본과 내용이 다른 것만 원본으로 맞춘다(새 스킬은 넣지 않음).
# 바뀐 것이 있으면 작업 브랜치 → PR → 병합. 손으로만 실행(앱 스킬 탭 버튼). 쓰기 토큰은 Actions secret(TARGET_REPO_TOKEN)에만. minho-nim/MinLab은 받지 않는다.
name: 모든 프로젝트 스킬 최신으로

on:
  workflow_dispatch:
    inputs:
      repos:
        description: '대상 저장소(owner/repo, 여러 개면 쉼표로)'
        required: true
      source:
        description: '스킬 원본 저장소(owner/repo)'
        required: true
        default: minho-nim/minoffia-skills

permissions:
  contents: read

concurrency: skills-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 원본과 다른 스킬만 맞추기·PR·병합
        env:
          REPOS: ${{ inputs.repos }}
          SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Actions secrets에 TARGET_REPO_TOKEN이 없습니다"; exit 1; }
          echo "$SOURCE" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || { echo "::error::스킬 원본 저장소 이름이 이상합니다"; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$SOURCE.git" /tmp/src || { echo "::error::스킬 원본을 받지 못했습니다"; exit 1; }
          src_sha=$(git -C /tmp/src rev-parse --short HEAD)
          # 스킬 이름 → 원본 폴더(어느 깊이든 <이름>/SKILL.md)
          dirof() { (cd /tmp/src && find . -path ./.git -prune -o -type f -name SKILL.md -path "*/$1/SKILL.md" -print | head -1 | xargs -r dirname); }
          ok=0; same=0; fail=0
          # 한 저장소. 단계마다 실패를 확인한다(set -e는 함수·&& || 안에서 믿을 수 없음)
          one() {
            REPO=$1
            base=$(gh api "repos/$REPO" --jq .default_branch) || { echo "::warning::$REPO: 저장소를 읽지 못함"; return 1; }
            rm -rf /tmp/repo
            git clone -q --depth 1 --branch "$base" "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" /tmp/repo || { echo "::warning::$REPO: 받지 못함"; return 1; }
            cd /tmp/repo || return 1
            names=$(ls -d .claude/skills/*/ .agents/skills/*/ 2>/dev/null | xargs -r -n1 basename | sort -u)
            changed=""
            for n in $names; do
              echo "$n" | grep -Eq '^[a-z0-9][a-z0-9-]{0,63}$' || continue
              d=$(dirof "$n"); [ -n "$d" ] || continue
              for dest in .agents/skills .claude/skills; do
                [ -d "$dest/$n" ] || continue
                if ! diff -rq "/tmp/src/$d" "$dest/$n" >/dev/null 2>&1; then
                  rm -rf "$dest/$n" && cp -R "/tmp/src/$d" "$dest/$n" && changed="$changed $n"
                fi
              done
            done
            changed=$(echo $changed | tr ' ' '\n' | sort -u | tr '\n' ' ')
            if [ -z "${changed// /}" ]; then echo "$REPO: 이미 최신"; cd - >/dev/null; return 2; fi
            git config user.name "minoffia"
            git config user.email "minoffia@users.noreply.github.com"
            head="ai/skills/refresh"
            git checkout -q -b "$head" && git add -A .agents/skills .claude/skills && git commit -q -m "스킬 최신으로: $(echo $changed | tr ' ' ',') ($SOURCE@$src_sha)" || { echo "::warning::$REPO: 커밋 못 함"; cd - >/dev/null; return 1; }
            git push -q --force origin "$head" || { echo "::warning::$REPO: 올리지 못함"; cd - >/dev/null; return 1; }
            owner=${REPO%%/*}
            url=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$head" --jq '.[0].html_url // empty')
            [ -n "$url" ] || url=$(gh api -X POST "repos/$REPO/pulls" -f title="스킬 최신으로: $(echo $changed | tr ' ' ',')" -f head="$head" -f base="$base" -f body="미노피아 스킬 탭의 '모든 프로젝트 스킬 최신으로'. 이 저장소에 이미 있는 스킬 중 원본($SOURCE@$src_sha)과 다른 것만 맞췄습니다." --jq .html_url) || { echo "::warning::$REPO: PR을 열지 못함"; cd - >/dev/null; return 1; }
            case "$url" in https://github.com/*/pull/*) ;; *) echo "::warning::$REPO: PR 주소가 이상함: $url"; cd - >/dev/null; return 1;; esac
            # 막 연 PR은 병합 가능 여부 계산 전이라 거절될 수 있다(v0.7.39 TestRepo): 6초 간격 5번까지
            merged=0; for try_ in 1 2 3 4 5; do if gh api -X PUT "repos/$REPO/pulls/${url##*/}/merge" -f merge_method=squash >/dev/null 2>&1; then merged=1; break; fi; sleep 6; done
            [ "$merged" = 1 ] || { echo "::warning::$REPO: PR은 열었지만 병합 못 함 $url"; cd - >/dev/null; return 1; }
            gh api -X DELETE "repos/$REPO/git/refs/heads/$head" >/dev/null 2>&1 || true
            echo "$REPO: 맞춤($changed) $url"
            cd - >/dev/null
          }
          for REPO in $(echo "$REPOS" | tr ',' ' '); do
            echo "$REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || { echo "::warning::이름이 이상해 건너뜀: $REPO"; fail=$((fail+1)); continue; }
            [ "$(echo "$REPO" | tr 'A-Z' 'a-z')" != "minho-nim/minlab" ] || { echo "건너뜀: $REPO(받지 않는 저장소)"; continue; }
            one "$REPO"; r=$?
            case $r in 0) ok=$((ok+1));; 2) same=$((same+1));; *) fail=$((fail+1));; esac
          done
          echo "끝: 맞춤 $ok · 이미 최신 $same · 실패 $fail"
          [ "$fail" -eq 0 ]
