# 운영 배포 버튼(소유자가 직접 누름): release 브랜치를 main으로 앞당긴다. Cloudflare Pages는 release만 배포한다.
# PC 명령 `git fetch origin && git push origin origin/main:refs/heads/release`와 같다. 휴대폰 GitHub 앱·브라우저에서
# Actions → "운영 배포(release)" → Run workflow로 실행한다. 자동으로는 돌지 않는다.
# fast-forward만 한다(강제 푸시 없음): release에 main에 없는 커밋이 있으면 실패하고 아무것도 바꾸지 않는다.
# main의 최신 커밋이 verify(CI)를 통과했을 때만 배포한다.
name: 운영 배포(release)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: main의 verify(CI) 통과 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse origin/main)
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "verify")][0].conclusion // "none"')
          echo "main ${sha:0:7} verify: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::main 최신 커밋의 verify가 성공이 아닙니다(${conclusion}). 배포하지 않습니다."
            exit 1
          fi
      - name: release를 main으로 앞당기기(fast-forward만)
        run: |
          if git rev-parse --verify -q origin/release >/dev/null; then
            if ! git merge-base --is-ancestor origin/release origin/main; then
              echo "::error::release가 main과 갈라져 있습니다(release에만 있는 커밋). 덮어쓰지 않습니다."
              exit 1
            fi
            if [ "$(git rev-parse origin/release)" = "$(git rev-parse origin/main)" ]; then
              echo "release가 이미 main과 같습니다. 배포할 것이 없습니다."
              exit 0
            fi
          fi
          from=$(git rev-parse --short origin/release 2>/dev/null || echo none)
          git push origin origin/main:refs/heads/release
          echo "release: ${from} → $(git rev-parse --short origin/main). Cloudflare 빌드가 끝나면(1~2분) 사이트에 반영됩니다."
      - name: 운영 반영 확인(버전)
        # v0.6.6(소유자 "왜 반영은 종종 안 하지"): Cloudflare 빌드가 밀리거나 늦게 끝난 옛 빌드가 덮어써, 배포가 '성공'인데
        # 사이트는 옛 버전인 일이 있었다. 사이트의 버전이 package.json과 같아질 때까지 최대 12분 확인하고,
        # 5분이 지나도 안 바뀌면 Cloudflare 배포 훅(secret CLOUDFLARE_DEPLOY_HOOK, 있으면)으로 한 번 다시 빌드시킨다. 끝내 다르면 실패로 알린다.
        env:
          SITE: ${{ vars.SITE_URL || 'https://minlab-ai-office.pages.dev' }}
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          want=$(node -p "require('./package.json').version")
          echo "기대 버전: ${want}"
          kicked=0
          for i in $(seq 1 48); do
            js=$(curl -fsS "${SITE}/?nc=${RANDOM}" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            have=$([ -n "$js" ] && curl -fsS "${SITE}/${js}" | grep -o "\"${want//./\\.}\"" | head -1 || true)
            if [ -n "$have" ]; then echo "운영 사이트가 ${want}로 바뀌었어요($((i * 15))초)."; exit 0; fi
            if [ "$i" -eq 20 ] && [ -n "$HOOK" ] && [ "$kicked" -eq 0 ]; then
              echo "5분이 지나도 그대로라 Cloudflare에 다시 빌드를 요청해요."; curl -fsS -X POST "$HOOK" >/dev/null && kicked=1 || true
            fi
            sleep 15
          done
          echo "::error::12분이 지나도 운영 사이트가 ${want}가 아니에요. Cloudflare 빌드가 밀렸거나 실패했어요. Cloudflare Pages 배포 목록을 확인하거나, 새 커밋으로 다시 배포하세요."
          exit 1
