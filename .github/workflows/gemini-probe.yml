# Gemini 웹 검색 모델 시험(v0.6.84, 소유자 "가능한 모델을 다 돌려 봐"): Actions 비밀값의 무료 키 2개로
# 이 키가 쓸 수 있는 모든 Gemini 모델에 Google 검색 연결 질문을 한 번씩 보내 되는지 본다. 결과는 모델 이름·상태만(키·답 본문은 남기지 않음).
name: Gemini 검색 모델 시험
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 모든 모델 시험
        env:
          KEY_A: ${{ secrets.GEMINI_API_KEY }}
          KEY_B: ${{ secrets.GEMINI_API_KEY2 }}
        run: |
          cat > /tmp/probe.mjs <<'JS'
          const base = 'https://generativelanguage.googleapis.com/v1beta';
          const keys = [['A', process.env.KEY_A], ['B', process.env.KEY_B]].filter(([, k]) => k);
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const short = (s) => String(s ?? '').replace(/\s+/g, ' ').replace(/AIza[0-9A-Za-z_-]+/g, '***').slice(0, 90);
          const rows = [];
          const list = await fetch(`${base}/models?pageSize=1000`, { headers: { 'x-goog-api-key': keys[0][1] } }).then((r) => r.json());
          const models = (list.models ?? [])
            .filter((m) => (m.supportedGenerationMethods ?? []).includes('generateContent') && /gemini/i.test(m.name) && !/embedding|image|tts|audio|live|robotics/i.test(m.name))
            .map((m) => m.name.replace(/^models\//, ''));
          console.log(`모델 ${models.length}개: ${models.join(', ')}`);
          for (const m of models) {
            for (const [slot, key] of keys) {
              const body = { contents: [{ role: 'user', parts: [{ text: '오늘 서울 날씨를 웹에서 찾아 한 줄로 답해 줘.' }] }], tools: [{ google_search: {} }], generationConfig: { maxOutputTokens: 80 } };
              let status = 0, note = '', sources = 0;
              try {
                const r = await fetch(`${base}/models/${m}:generateContent`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body), signal: AbortSignal.timeout(30000) });
                status = r.status;
                const d = await r.json().catch(() => ({}));
                sources = d.candidates?.[0]?.groundingMetadata?.groundingChunks?.length ?? 0;
                note = r.ok ? `검색 출처 ${sources}개` : short(d.error?.message);
              } catch (e) { note = short(e.message); }
              rows.push({ m, slot, status, sources, note });
              console.log(`${status === 200 && sources > 0 ? '✅' : status === 200 ? '⚠️' : '❌'} ${m} 키${slot} HTTP ${status} ${note}`);
              await sleep(1500);
            }
          }
          const ok = [...new Set(rows.filter((r) => r.status === 200 && r.sources > 0).map((r) => r.m))];
          const lines = ['## Gemini 웹 검색 모델 시험', '', `검색 되는 모델: ${ok.length ? ok.join(', ') : '없음'}`, '', '| 모델 | 키 | HTTP | 결과 |', '|---|---|---|---|', ...rows.map((r) => `| ${r.m} | ${r.slot} | ${r.status} | ${r.note} |`)];
          await import('node:fs').then((fs) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n'));
          console.log(`RESULT_OK=${ok.join(',')}`);
          JS
          node /tmp/probe.mjs
