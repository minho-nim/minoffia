name: verify

# main 병합 뒤에는 다시 돌지 않는다(v0.6.53 소유자 결정, Actions 분량 아끼기): 운영 배포가 "main의 코드가 PR에서 검사를
# 통과한 코드와 똑같은지(tree 같음)"를 확인한다. 다르면(PR이 옛 main 기준이었으면) 이 검사를 main에서 수동 실행한 뒤 배포한다.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions 무료 분량 아끼기(v0.6.51 소유자 결정): 같은 브랜치에 새로 올리면 이전 검사는 취소한다.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.changes.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # DB 시험은 마이그레이션·DB 시험 파일이 바뀐 때만(작업마다 1분 올림이라 나눠 돌면 1분씩 더 든다)
      - name: DB 관련 변경 확인
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "db=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if echo "$files" | grep -qE '^(supabase/migrations/|supabase/tests/|scripts/test-db\.sh$|\.github/workflows/verify\.yml$)'; then db=true; else db=false; fi
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "DB 시험: $db"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  verify-db:
    needs: verify
    if: needs.verify.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 클라이언트 확인
        run: psql --version
      - name: 마이그레이션·승인·RLS·동시 예약 검증
        run: bash scripts/test-db.sh
